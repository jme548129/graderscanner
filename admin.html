<!DOCTYPE html>
<html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grader Admin</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#EDF4F3;color:#12302F}
main{max-width:900px;margin:0 auto;padding:16px}
h1{margin:8px 0}h2{margin:24px 0 8px;font-size:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff;border-radius:14px;padding:12px 16px;flex:1;min-width:120px}.stat b{display:block;font-size:26px;color:#0E6B6B}
.wrap{overflow-x:auto;background:#fff;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #D3E2E0;white-space:nowrap}th{background:#F6FAF9}
a{color:#0E6B6B}
</style></head><body><main>
<h1>Mga gumagamit ng Grader</h1><p id="s">Naglo-load…</p><div id="o"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=x=>x?new Date(x).toLocaleString('fil-PH'):'';
(async()=>{
 const C=window.GRADER_CONFIG;
 if(!C||/YOUR_/.test(C.SUPABASE_URL)){$('s').textContent='Ilagay muna ang Supabase URL at key sa config.js.';return}
 const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('s').innerHTML='Mag-login muna sa <a href="index.html">Grader</a>, tapos bumalik dito.';return}
 const {data:adm}=await sb.rpc('is_admin');
 if(!adm){$('s').textContent='Hindi admin ang account na ito. Tingnan ang README para maging admin.';return}
 const [{data:P},{data:R}]=await Promise.all([
  sb.from('profiles').select('*').order('last_seen',{ascending:false}),
  sb.from('results').select('*').order('created_at',{ascending:false}).limit(200)]);
 const wk=Date.now()-7*864e5,active=P.filter(u=>new Date(u.last_seen)>wk).length,scans=P.reduce((a,u)=>a+(u.scans||0),0);
 $('s').innerHTML=`<div class="stats"><div class="stat"><b>${P.length}</b>Kabuuang users</div><div class="stat"><b>${active}</b>Aktibo (7 araw)</div><div class="stat"><b>${scans}</b>Na-save na papel</div></div>`;
 $('o').innerHTML=`<h2>Users</h2><div class="wrap"><table><tr><th>Pangalan</th><th>Email</th><th>Paaralan</th><th>Papel</th><th>Sumali</th><th>Huling gamit</th></tr>${
  P.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.school)}</td><td>${u.scans||0}</td><td>${dt(u.created_at)}</td><td>${dt(u.last_seen)}</td></tr>`).join('')}</table></div>
 <h2>Pinakabagong resulta</h2><div class="wrap"><table><tr><th>Petsa</th><th>Guro</th><th>Pagsusulit</th><th>Estudyante</th><th>ID</th><th>Iskor</th></tr>${
  R.map(r=>{const u=P.find(x=>x.id===r.user_id)||{};return `<tr><td>${dt(r.created_at)}</td><td>${esc(u.full_name||u.email)}</td><td>${esc(r.exam_type)} ${esc(r.exam_title)}</td><td>${esc(r.student_name)}</td><td>${esc(r.student_id)}</td><td>${r.score}/${r.total}</td></tr>`}).join('')}</table></div>`;
})();
</script></body></html>
